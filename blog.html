<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog — Silk Spa Wellness & Beauty</title>
<meta name="description" content="Wellness tips, beauty advice and spa insights from Silk Spa Abuja."/>

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ivory: #F5F0E8;
    --ivory-dark: #EDE6D6;
    --gold: #C9A96E;
    --gold-light: #E8D5B0;
    --gold-deep: #A8843A;
    --black: #0F0F0F;
    --black-soft: #1C1C1C;
    --white: #FFFFFF;
    --text-muted: #4A4035;
    --text-light: #6B5E50;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Montserrat', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); background: var(--ivory); color: var(--black); min-height: 100vh; }

  /* ── NAVBAR ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 52px; height: 80px;
    background: rgba(245,240,232,0.97);
    box-shadow: 0 1px 30px rgba(201,169,110,0.12);
    backdrop-filter: blur(10px);
  }
 .nav-logo { text-decoration: none; display: flex; flex-direction: column; gap: 2px; }
  .nav-logo-main { font-family: var(--serif); font-size: 28px; font-weight: 500; color: var(--black); letter-spacing: 0.06em; line-height: 1; }
  .nav-logo-main span { color: var(--gold); }
  .logo-img {
  width: 200px;
  height: auto;
  display: block;
}
  .nav-logo-sub { font-size: 9px; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-light); }
  .nav-back { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
  .nav-back:hover { color: var(--gold); }
  .nav-back svg { width: 16px; height: 16px; }
  /* ── HERO ── */
  .blog-hero {
    background: var(--black);
    padding: 160px 80px 80px;
    text-align: center;
  }
  .blog-hero-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 20px;
  }
  .blog-hero-title {
    font-family: var(--serif); font-size: clamp(42px, 6vw, 80px);
    font-weight: 300; color: var(--white); line-height: 1.1; margin-bottom: 20px;
  }
  .blog-hero-title em { font-style: italic; color: var(--gold-light); }
  .blog-hero-sub {
    font-size: 13px; font-weight: 300; color: rgba(255,255,255,0.5);
    line-height: 1.8; max-width: 500px; margin: 0 auto;
  }

  /* ── BLOG GRID ── */
  .blog-section { padding: 80px; }
  .blog-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 32px; max-width: 1200px; margin: 0 auto;
  align-items: stretch;
}
  /* ── BLOG CARD ── */
  .blog-card {
    background: var(--white); cursor: pointer;
    transition: transform 0.3s; display: flex; flex-direction: column;
  }
  .blog-card:hover { transform: translateY(-4px); }
  .blog-card-top {
  background: var(--black); padding: 32px 28px 24px;
  position: relative; overflow: hidden;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
  .blog-card-top::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; background: var(--gold);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s;
  }
  .blog-card:hover .blog-card-top::after { transform: scaleX(1); }
  .blog-card-num {
    font-family: var(--serif); font-size: 48px; font-weight: 300;
    color: rgba(201,169,110,0.2); line-height: 1; margin-bottom: 16px;
  }
  .blog-card-title {
  font-family: var(--serif); font-size: 22px; font-weight: 400;
  color: var(--white); line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
  .blog-card-body { padding: 24px 28px 32px; flex: 1; display: flex; flex-direction: column; }
  .blog-card-excerpt {
    font-size: 12px; font-weight: 300; color: var(--text-muted);
    line-height: 1.8; flex: 1; margin-bottom: 24px;
  }
  .blog-card-meta {
    display: flex; justify-content: space-between; align-items: center;
  }
  .blog-card-date {
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-light);
  }
  .blog-card-link {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold); text-decoration: none;
    border-bottom: 1px solid var(--gold-light); padding-bottom: 2px;
    transition: border-color 0.3s;
  }
  .blog-card-link:hover { border-color: var(--gold); }

  /* ── EMPTY STATE ── */
  .blog-empty {
    grid-column: 1/-1; text-align: center; padding: 80px 40px;
  }
  .blog-empty-icon {
    font-family: var(--serif); font-size: 64px; font-weight: 300;
    color: var(--gold-light); line-height: 1; margin-bottom: 20px;
  }
  .blog-empty-title {
    font-family: var(--serif); font-size: 32px; font-weight: 300;
    color: var(--black); margin-bottom: 12px;
  }
  .blog-empty-text {
    font-size: 13px; font-weight: 300; color: var(--text-muted); line-height: 1.8;
  }

  /* ── BLOG POST MODAL ── */
  .blog-modal {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(15,15,15,0.95);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    padding: 40px 24px;
    overflow-y: auto;
  }
  .blog-modal.open { opacity: 1; pointer-events: all; }
  .blog-modal-inner {
    background: var(--ivory); max-width: 720px; width: 100%;
    padding: 60px; position: relative;
    max-height: 90vh; overflow-y: auto;
  }
  .blog-modal-close {
    position: absolute; top: 24px; right: 28px;
    background: none; border: none; cursor: pointer;
    font-size: 28px; color: var(--text-muted); transition: color 0.2s;
  }
  .blog-modal-close:hover { color: var(--gold); }
  .blog-modal-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 16px;
  }
  .blog-modal-title {
    font-family: var(--serif); font-size: clamp(28px, 4vw, 44px);
    font-weight: 300; color: var(--black); line-height: 1.2; margin-bottom: 12px;
  }
  .blog-modal-date {
    font-size: 11px; font-weight: 400; color: var(--text-light);
    letter-spacing: 0.06em; margin-bottom: 36px;
    padding-bottom: 36px; border-bottom: 1px solid var(--ivory-dark);
  }
  .blog-modal-content {
    font-size: 14px; font-weight: 300; color: var(--text-muted);
    line-height: 2; white-space: pre-wrap;
  }
  .blog-modal-footer {
    margin-top: 48px; padding-top: 32px;
    border-top: 1px solid var(--ivory-dark);
    display: flex; justify-content: space-between; align-items: center;
  }
  .blog-modal-brand {
    font-family: var(--serif); font-size: 18px; font-weight: 400; color: var(--black);
  }
  .blog-modal-brand span { color: var(--gold); }
  .btn-book {
    display: inline-block; background: var(--gold); color: var(--white);
    padding: 12px 32px; text-decoration: none; font-size: 11px;
    font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    transition: background 0.3s;
  }
  .btn-book:hover { background: var(--gold-deep); }

  /* ── LOADING ── */
  .loading-state {
    grid-column: 1/-1; text-align: center; padding: 60px;
    font-size: 13px; color: var(--text-muted); font-weight: 300;
    letter-spacing: 0.06em;
  }

  /* ── WHATSAPP ── */
  .whatsapp-float { position:fixed; bottom:36px; right:36px; width:56px; height:56px; background:#25D366; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:999; text-decoration:none; box-shadow:0 4px 20px rgba(37,211,102,0.35); transition:transform 0.3s; }
  .whatsapp-float:hover { transform:scale(1.1); }
  .whatsapp-float svg { width:28px; height:28px; fill:white; }

  /* ── FOOTER ── */
  .blog-footer {
    background: var(--black); padding: 40px 80px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 20px;
  }
  .blog-footer-brand {
    font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--white);
  }
  .blog-footer-brand span { color: var(--gold); }
  .blog-footer-links { display: flex; gap: 28px; }
  .blog-footer-links a {
    font-size: 11px; font-weight: 400; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.3s;
  }
  .blog-footer-links a:hover { color: var(--gold); }

  /* ── MOBILE ── */
  @media (max-width: 900px) {
    nav { padding: 0 24px; }
    .blog-hero { padding: 120px 24px 60px; }
    .blog-section { padding: 60px 24px; }
    .blog-grid { grid-template-columns: 1fr; gap: 20px; }
    .blog-modal-inner { padding: 40px 28px; }
    .blog-footer { padding: 40px 24px; flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
   <a href="index.html" class="nav-logo">
    <img src="images/logo-black.png" alt="Silk Spa" style="height: 66px; width: auto;"/>
  </a>
  <a href="index.html" class="nav-back"
    onmouseover="this.style.color='#C9A96E'"
    onmouseout="this.style.color='#4A4035'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Home
  </a>
</nav>

<!-- HERO -->
<div class="blog-hero">
  <p class="blog-hero-label">Silk Spa Journal</p>
  <h1 class="blog-hero-title">Wellness <em>insights</em><br/>from our experts</h1>
  <p class="blog-hero-sub">Tips, treatments and everything you need to know about looking and feeling your best.</p>
</div>

<!-- BLOG GRID -->
<div class="blog-section">
  <div class="blog-grid" id="blogGrid">
    <div class="loading-state">Loading posts...</div>
  </div>

<!-- BLOG POST MODAL -->
<div class="blog-modal" id="blogModal">
  <div class="blog-modal-inner">
    <button class="blog-modal-close" onclick="closePost()">&times;</button>
    <p class="blog-modal-label">Silk Spa Journal</p>
    <h2 class="blog-modal-title" id="modalTitle"></h2>

      <div class="blog-modal-brand">Silk <span>Spa</span></div>

</div>

<!-- FOOTER -->
<footer class="blog-footer">
  <div class="blog-footer-brand">Silk <span>Spa</span></div>
  <div class="blog-footer-links">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="booking.html">Book Now</a>
    <a href="index.html#contact">Contact</a>
  </div>

<script>
  const API = 'https://silkspa-server.onrender.com/api';

  // ── LOAD BLOG POSTS ──
  async function loadBlogs() {
    const grid = document.getElementById('blogGrid');

    try {
      const res = await fetch(`${API}/blogs`);
      const blogs = await res.json();

      if (!blogs.length) {
        grid.innerHTML = `
          <div class="blog-empty">
            <div class="blog-empty-icon">✦</div>
            <h3 class="blog-empty-title">Coming soon</h3>
            <p class="blog-empty-text">
              Our wellness journal is being prepared.<br/>
              Check back soon for tips, insights and expert advice.
            </p>
          </div>`;
        return;
      }

      grid.innerHTML = '';
      blogs.forEach((blog, index) => {
        const num = String(index + 1).padStart(2, '0');
        const date = new Date(blog.created_at).toLocaleDateString('en-GB', {
          day: 'numeric', month: 'long', year: 'numeric'
        });
        const excerpt = blog.content.length > 160
          ? blog.content.substring(0, 160) + '...'
          : blog.content;

        grid.innerHTML += `
          <div class="blog-card" onclick="openPost('${blog.id}')">
            <div class="blog-card-top">
              <div class="blog-card-num">${num}</div>
              <h2 class="blog-card-title">${blog.title}</h2>
            </div>
            <div class="blog-card-body">
              <p class="blog-card-excerpt">${excerpt}</p>
              <div class="blog-card-meta">
                <span class="blog-card-date">${date}</span>
                <span class="blog-card-link">Read more</span>
              </div>
            </div>
          </div>
        `;
      });

      // Store blogs for modal access
      window.blogData = blogs;

    } catch (err) {
      grid.innerHTML = `
        <div class="blog-empty">
          <div class="blog-empty-icon">✦</div>
          <h3 class="blog-empty-title">Could not load posts</h3>
          <p class="blog-empty-text">Please make sure the server is running.</p>
        </div>`;
    }
  }

  // ── OPEN POST MODAL ──
  function openPost(id) {
    const blog = window.blogData.find(b => b.id === id);
    if (!blog) return;

    const date = new Date(blog.created_at).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric'
    });

    document.getElementById('modalTitle').textContent = blog.title;
    document.getElementById('modalDate').textContent = 'Published ' + date;
    document.getElementById('modalContent').textContent = blog.content;

    document.getElementById('blogModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  // ── CLOSE POST MODAL ──
  function closePost() {
    document.getElementById('blogModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Close modal on background click
  document.getElementById('blogModal').addEventListener('click', function(e) {
    if (e.target === this) closePost();
  });

  // Close on Escape key
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePost();
  });

  // ── INIT ──
  loadBlogs();
</script>
</body>
